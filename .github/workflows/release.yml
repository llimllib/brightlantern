name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Not ubuntu, unlike CI. The binary needs cgo -- go-sqlite3, the sqlite-vec
    # bindings and FTS5 all do -- so it has to be built on the platform it runs
    # on. arm64, which is the only target .goreleaser.yaml declares, so nothing
    # is cross-compiled.
    #
    # Pinned to 26 rather than latest: the titles helper links FoundationModels,
    # which needs the macOS 26 SDK, and an image change should be a decision
    # rather than something a release discovers.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from the commits since the previous
          # tag, and a shallow clone has neither.
          fetch-depth: 0

      # Brings go, node, pnpm and goreleaser, and with them the [env] block --
      # GOFLAGS, and the CGO_CFLAGS that points cgo at the staged sqlite3.h.
      # .goreleaser.yaml refuses to build without the latter rather than
      # compiling against whichever header the runner happens to ship.
      - uses: jdx/mise-action@v5
        with:
          experimental: true

      # Asked of go rather than written down, so a runner image that moves
      # them cannot quietly empty the cache. A miss shows as every module
      # downloaded twice, since lint and test start together.
      - name: Locate Go's caches
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.modules }}
          key: go-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-v2-${{ runner.os }}-

      # The release is Bright Lantern.app, which carries the sqlite-lembed
      # extension and the embedding model, and `mise run setup` builds the
      # first from source. That is a llama.cpp checkout and a couple of minutes of
      # cmake, unchanged between releases, so it is worth keeping.
      #
      # Building needs cmake, which the macOS runner image already provides.
      # Compiling Metal shaders does not need a GPU; only running the model
      # does, which is why the semantic tests skip here and the smoke test
      # below checks the paths rather than the search.
      - name: Cache the extension and model
        uses: actions/cache@v6
        with:
          path: ~/.local/share/brightlantern
          # The titles helper is built into the same directory, so its source
          # is part of the key: otherwise a changed main.swift would rely on
          # mise judging the restored binary stale by mtime.
          key: lembed-${{ runner.os }}-${{ hashFiles('mise-tasks/setup', 'cmd/brightlantern-apple/*.swift') }}

      # For `mise run ts`, which .goreleaser.yaml runs as a before hook:
      # internal/web embeds internal/web/static, and app.js is generated.
      - run: pnpm install --frozen-lockfile

      # The same gate CI applies, on the artifact that goes out to people.
      - run: mise run check

      # A snapshot first, checked: the zip has to hold the whole bundle, and
      # .goreleaser.yaml lists its files by hand. Finding that out here costs
      # a minute; finding it in a published release costs a broken install.
      - run: mise run release-check

      - name: Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing the cask means committing to llimllib/homebrew-tap,
          # which GITHUB_TOKEN has no access to. A PAT with contents:write on
          # that repository.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
