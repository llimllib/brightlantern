name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Not ubuntu, unlike CI. The binary needs cgo -- go-sqlite3, the sqlite-vec
    # bindings and FTS5 all do -- so it has to be built on the platform it runs
    # on. arm64, which is the only target .goreleaser.yaml declares, so nothing
    # is cross-compiled.
    #
    # Pinned to 26 rather than latest: the titles helper links FoundationModels,
    # which needs the macOS 26 SDK, and an image change should be a decision
    # rather than something a release discovers.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from the commits since the previous
          # tag, and a shallow clone has neither.
          fetch-depth: 0

      # Brings go, node, pnpm and goreleaser, and with them the [env] block --
      # GOFLAGS, and the CGO_CFLAGS that points cgo at the staged sqlite3.h.
      # .goreleaser.yaml refuses to build without the latter rather than
      # compiling against whichever header the runner happens to ship.
      - uses: jdx/mise-action@v5
        with:
          experimental: true

      # Asked of go rather than written down, so a runner image that moves
      # them cannot quietly empty the cache. A miss shows as every module
      # downloaded twice, since lint and test start together.
      - name: Locate Go's caches
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.modules }}
          key: go-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-v2-${{ runner.os }}-

      # The release is Bright Lantern.app, which carries the sqlite-lembed
      # extension and the embedding model, and `mise run setup` builds the
      # first from source. That is a llama.cpp checkout and a couple of minutes of
      # cmake, unchanged between releases, so it is worth keeping.
      #
      # Building needs cmake, which the macOS runner image already provides.
      # Compiling Metal shaders does not need a GPU; only running the model
      # does, which is why the semantic tests skip here and the smoke test
      # below checks the paths rather than the search.
      - name: Cache the extension and model
        uses: actions/cache@v6
        with:
          path: ~/.local/share/brightlantern
          # The titles helper is built into the same directory, so its source
          # is part of the key: otherwise a changed main.swift would rely on
          # mise judging the restored binary stale by mtime.
          key: lembed-${{ runner.os }}-${{ hashFiles('mise-tasks/setup', 'cmd/brightlantern-apple/*.swift') }}

      # For `mise run ts`, which .goreleaser.yaml runs as a before hook:
      # internal/web embeds internal/web/static, and app.js is generated.
      - run: pnpm install --frozen-lockfile

      # The same gate CI applies, on the artifact that goes out to people.
      - run: mise run check

      # The Developer ID, for mise-tasks/bundle, which finds it with `security
      # find-identity` and refuses to sign a release without it (#78). A
      # keychain made and destroyed within the job, never the login one; the
      # secrets are #87's, and these steps are the ones its check proved.
      #
      # Not goreleaser's notarize.macos, whose signer (quill) signs Mach-O
      # files and not bundles: the bundle's seal over its resources and its
      # nested code is codesign's.
      #
      # set-key-partition-list is what lets codesign use a key imported from
      # the command line; without it, errSecInternalComponent (#85). The .p12
      # has to be PBE-SHA1-3DES for `security import` to read it at all.
      - name: Import the signing identity
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(uuidgen)"
          printf '%s' "$MACOS_SIGN_P12" | base64 -D > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          # Into the search list, which is where find-identity and codesign
          # look. Word splitting is wanted: it is a list of paths.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      # A snapshot first, checked: the zip has to hold the whole bundle, and
      # .goreleaser.yaml lists its files by hand. Finding that out here costs
      # a minute; finding it in a published release costs a broken install.
      - run: mise run release-check

      - name: Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing the cask means committing to llimllib/homebrew-tap,
          # which GITHUB_TOKEN has no access to. A PAT with contents:write on
          # that repository.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # mise-tasks/notarize, from goreleaser's post-build hook (#79). The
          # App Store Connect API key from #87; the .p8 is base64.
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      # The zip that was uploaded, as a user's Mac will see it. Notarize
      # checked the bundle before archiving, but the ticket reaches the zip
      # only through the files: list in .goreleaser.yaml, which release-check
      # cannot test because snapshots are not notarized. After publishing,
      # since goreleaser has no hook between archiving and uploading; a red
      # release run is the alarm.
      - name: Verify the published zip
        run: |
          d="$RUNNER_TEMP/published"
          ditto -x -k dist/brightlantern_*_macos_arm64.zip "$d"
          codesign --verify --strict --deep "$d/Bright Lantern.app"
          xcrun stapler validate "$d/Bright Lantern.app"
          spctl -a -vvv -t exec "$d/Bright Lantern.app"

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
