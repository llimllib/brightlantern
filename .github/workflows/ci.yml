name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # macOS, the only platform Bright Lantern runs on (#91), and the release
    # runner's image: the titles helper and the app link frameworks from the
    # macOS 26 SDK, which Linux CI could never build. Pinned for the same
    # reason release.yml is.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # No sqlite step. sqlite-vec's cgo bindings include sqlite3.h, but the
      # sqlite-header task stages the one matching the amalgamation go-sqlite3
      # actually links, and CGO_CFLAGS points at it -- so the SDK's header is
      # neither needed nor consulted.

      # Installs go, node, pnpm, and golangci-lint from mise.toml, and brings
      # the [env] block with it -- which is where GOFLAGS=-tags=sqlite_fts5
      # lives. Without that tag the schema fails at runtime with "no such
      # module: fts5", so CI has to inherit it the same way a developer does
      # rather than restating it here.
      - uses: jdx/mise-action@v4
        with:
          # mise.toml installs tools through the go: and npm: backends, which
          # mise gates behind this.
          experimental: true

      # cgo, for mattn/go-sqlite3 and the sqlite-vec bindings. Slow to compile
      # and unchanged between runs.
      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # The model and the sqlite-lembed dylib: a 25MB download and a minute
      # of llama.cpp, keyed on the script that makes them. Before check, so
      # the semantic tests run if the runner reaches Metal and skip if not.
      - name: Cache embedding model and extension
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/brightlantern/lembed0.dylib
            ~/.local/share/brightlantern/all-MiniLM-L6-v2.Q8_0.gguf
          key: lembed-${{ runner.os }}-${{ hashFiles('mise-tasks/setup') }}

      - run: mise run setup

      - run: pnpm install --frozen-lockfile

      # gofmt, go vet, golangci-lint, oxlint, tsc, go test. The test task
      # depends on the TypeScript build, because the web package embeds
      # internal/web/static and app.js is generated rather than committed.
      - run: mise run check

      - name: Build
        run: mise run build

      # The binary has to start and report its own configuration. This is
      # where a missing FTS5 build tag or a broken embed directive shows up,
      # neither of which any test would catch.
      - name: Smoke test
        run: ./brightlantern info

      # The app's logic that needs no window: registration decisions, the
      # startup pages, reading config.toml.
      - name: App tests
        run: mise run app-test

      # The bundle, signed ad-hoc (the runner has no Developer ID), ending in
      # codesign --verify --strict --deep. Registering it needs a login
      # session, which a runner does not have.
      - name: Build the app
        run: mise run app

      # Playwright's browsers are a download into a shared cache, not a
      # repository dependency, so they have to be asked for explicitly. Keyed
      # on the lockfile because the browser build is pinned to the
      # @playwright/test version.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      # The only tests that drive a browser, and so the only ones that can
      # tell whether j moves the cursor or a match scrolls into view. Kept out
      # of `mise run check` because they are an order of magnitude slower than
      # the rest of the suite.
      - name: Browser tests
        run: mise run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
