# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# darwin/arm64 only, deliberately. go-sqlite3, the sqlite-vec bindings and
# FTS5 all need cgo, so CGO_ENABLED=0 -- which is how the other repositories
# here cross-compile four ways from one runner -- is not available. Restricting
# the target to the one architecture everybody involved runs removes the cross
# compilation problem rather than solving it: a macos runner is already arm64,
# so nothing is cross-compiled at all.
#
# Must run under mise, which is where CGO_CFLAGS comes from. See the preflight
# hook below, and `mise run release`.
version: 2

before:
  hooks:
    # sqlite-vec's cgo bindings compile with #include "sqlite3.h", and the
    # header they get has to be the one matching the amalgamation go-sqlite3
    # actually links rather than whatever the machine has. CGO_CFLAGS points at
    # third_party/sqlite; mise.toml sets it, and a release built without it
    # compiles perfectly well against the wrong struct layouts. Fail loudly
    # instead.
    - >-
      sh -c 'case "$CGO_CFLAGS" in *third_party/sqlite*) ;;
      *) echo "CGO_CFLAGS does not point at third_party/sqlite -- run it through mise, with (mise run release)" >&2; exit 1 ;; esac'

    # Both generated, neither committed, both required.
    - mise run sqlite-header
    # internal/web embeds internal/web/static, and app.js is compiled from
    # TypeScript. A missing one is embedded silently and ships the previous
    # release's keyboard handling, so this cannot be left to whoever invokes
    # goreleaser.
    - mise run ts

    # The sqlite-lembed dylib, the model and the titles helper, all of which
    # the bundle carries; mise-tasks/bundle takes them from the data
    # directory. Idempotent; the slow part only runs when they are missing.
    - mise run setup
    - mise run apple

builds:
  - id: brightlantern
    main: ./cmd/brightlantern
    # Built straight into its place in the bundle, which the post hook below
    # assembles around it. That makes the bundle an ordinary darwin archive,
    # which homebrew_casks needs and a meta archive is not.
    binary: "Bright Lantern.app/Contents/MacOS/brightlantern"
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
    # Explicit rather than inherited from mise.toml's GOFLAGS. Without the tag
    # the binary builds and then fails at runtime with "no such module: fts5",
    # which is not a thing to learn from a bug report.
    flags:
      - -tags=sqlite_fts5
    ldflags:
      # main.Version, not the main.version goreleaser defaults to: the variable
      # already exists and `mise run build` already stamps it the same way.
      - -s -w -X main.Version={{ .Version }}
    # The release is Bright Lantern.app with this binary inside, assembled by
    # the script `mise run app` uses so that the two cannot drift (#77). One
    # target, so this runs once.
    hooks:
      post:
        # release mode refuses to sign ad-hoc and takes a secure timestamp
        # (#78); a snapshot, as CI builds, is whatever the keychain allows.
        - mise-tasks/bundle "{{ dir (dir (dir .Path)) }}" {{ .Version }} {{ if .IsSnapshot }}snapshot{{ else }}release{{ end }}

archives:
  # The bundle and nothing else (#77): one artefact rather than a CLI
  # tarball and an app that each carry the binary, the dylib and the model,
  # and the only shape that can be stapled (#79). LICENSE and NOTICE.md are
  # inside it, in Contents/Resources.
  - formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_macos_arm64"
    #
    # The daemon is already in the archive, being the build, and adding it a
    # second time is an error. So the files are listed rather than globbed
    # whole, and something added to Contents/MacOS has to be named here too:
    # `mise run release-check`, in CI, compares the zip against the bundle,
    # which is how that gets noticed before a release rather than after.
    #
    # dst names Contents because goreleaser strips the matches' common prefix,
    # which runs through Contents/.
    files:
      - src: "dist/brightlantern_darwin_arm64_v8.0/Bright Lantern.app/Contents/{Info.plist,Library/**/*,Resources/*,_CodeSignature/*,MacOS/brightlantern-app,MacOS/brightlantern-apple,MacOS/lembed0.dylib}"
        dst: "Bright Lantern.app/Contents"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# A cask, not a formula. git-ls uses goreleaser's `brews:` block because that
# was the preferred path when it was written; Homebrew has since moved prebuilt
# binaries to casks, and llimllib/homebrew-tap already holds only Casks/.
homebrew_casks:
  - name: brightlantern
    homepage: "https://github.com/llimllib/brightlantern"
    # Both agents, which the cask has claimed since v0.0.1 without saying so:
    # reading Claude Code's format is most of what M11 was.
    description: "Search and read agent sessions from pi and Claude Code"
    # No license field here, though the config accepts one: goreleaser parses it
    # and its cask template never emits it -- checked at 2.17.0, 2.18.1 and
    # main. Homebrew requires the stanza of formulae, not casks. LICENSE travels
    # in the archive instead, which is what MIT actually asks for.
    # The CLI is linked out of the installed bundle, and embed.DefaultPaths
    # finds the extension and the model by resolving that symlink into
    # Contents/MacOS -- see internal/embed/paths_test.go. From appdir, not
    # the staged archive, which the app stanza has moved the bundle out of.
    # Spelled out because left empty, goreleaser writes the build's base
    # name, `binary "brightlantern"`, which names nothing once the app moves.
    binaries:
      - "#{appdir}/Bright Lantern.app/Contents/MacOS/brightlantern"
    repository:
      owner: llimllib
      name: homebrew-tap
      branch: main
      # a token that allows pushing to llimllib/homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    # Homebrew quarantines cask artifacts by default -- that is what
    # --no-quarantine exists to override -- and nothing here is signed by a
    # Developer ID, only adhoc/linker-signed. Without this both files are
    # refused: the binary dies with "Killed: 9" behind an "Apple could not
    # verify" dialog, and the dylib fails dlopen with a misleading "no such
    # file" that degrades silently to keyword-only search.
    #
    # Recursive over the whole bundle rather than naming the binary, which is
    # where this differs from the other casks in the tap: the extension is
    # dlopen'd and needs clearing just as much as the executable does. Over
    # the bundle in appdir, not the staged path, which the app stanza has
    # moved it out of.
    #
    # The real fix is a Developer ID signature and notarization (#78, #79),
    # which delete this. That would also cover someone who downloads the zip
    # directly, which this does not.
    #
    # The inner quoting is a Go template emitting a literal {{appdir}}, which
    # is Homebrew's placeholder, not goreleaser's. postflight_steps rather
    # than a postflight block, which Homebrew's style checks now reject.
    #
    # The app stanza is written here because goreleaser's cask has no app
    # field (#77).
    custom_block: |
      app "Bright Lantern.app"

      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{appdir}}" }}/Bright Lantern.app"]
        end
      end
    caveats: |
      Open Bright Lantern from Applications once. It finds your agent
      sessions, indexes them, and keeps indexing at login with no window
      open. `brightlantern` on the command line uses the same index.

      Titles are generated on-device and need Apple Intelligence turned on.

release:
  footer: |
    ---

    The zip is Bright Lantern.app, which carries the daemon, the
    sqlite-lembed extension and the embedding model, so semantic search works
    with nothing else installed.

    `brew install llimllib/tap/brightlantern`
