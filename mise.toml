[tools]
go = "1.26"
node = "24"
# npm backend rather than the default aqua one: aqua verifies pnpm's GitHub
# artifact attestations, which currently fail against pnpm's release workflow.
#
# Pinned, and kept equal to package.json's packageManager field. With "latest"
# the two disagree, and pnpm quietly downloads the pinned version at every
# invocation to honour packageManager -- reproducible, but an undeclared
# network fetch in the middle of CI.
"npm:pnpm" = "10.15.0"
golangci-lint = "latest"
"go:github.com/bokwoon95/wgo" = "latest"
# Pinned to a major version: goreleaser's configuration schema is versioned,
# and .goreleaser.yaml declares `version: 2`.
goreleaser = "2"

[env]
# mattn/go-sqlite3 omits FTS5 unless this tag is set, and without it the schema
# fails at runtime with the unhelpful "no such module: fts5". Setting it in the
# environment rather than in a build wrapper means plain `go test`, `go vet`,
# and editor tooling all get it too.
GOFLAGS = "-tags=sqlite_fts5"

# Where the embedding model and the sqlite-lembed extension are installed.
BRIGHTLANTERN_DATA_DIR = "{{env.HOME}}/.local/share/brightlantern"

# Compile sqlite-vec against the header for the SQLite that actually gets
# linked, rather than whatever the machine has in /usr/include. See
# mise-tasks/sqlite-header. Pointing at a directory that does not exist yet is
# harmless; the build task stages it first.
CGO_CFLAGS = "-I{{config_root}}/third_party/sqlite"

[tasks.sqlite-header]
description = "Stage sqlite3.h matching go-sqlite3's bundled amalgamation"
sources = ["go.sum"]
outputs = ["third_party/sqlite/sqlite3.h"]

[tasks.ts]
description = "Compile TypeScript to web/static/app.js"
run = "pnpm exec tsc"
sources = ["internal/web/ts/*.ts", "tsconfig.json"]
outputs = ["internal/web/static/app.js"]

[tasks.apple]
description = "Build the on-device titles helper into the data directory"
# Swift, compiled with plain swiftc: FoundationModels ships in the Command Line
# Tools SDK, so no Xcode. Into the data directory rather than beside
# ./brightlantern because that is where embed.Beside looks for a binary that
# moves -- go run's lives in a temp directory -- the same place setup puts the
# extension.
sources = ["cmd/brightlantern-apple/*.swift"]
outputs = ["{{env.BRIGHTLANTERN_DATA_DIR}}/brightlantern-apple"]
run = '''
command -v swiftc >/dev/null || { echo "apple: no swiftc; install Command Line Tools: xcode-select --install" >&2; exit 1; }
mkdir -p "$BRIGHTLANTERN_DATA_DIR"
swiftc -O -target arm64-apple-macos26.0 -o "$BRIGHTLANTERN_DATA_DIR/brightlantern-apple" cmd/brightlantern-apple/main.swift
'''

[tasks.app]
description = "Build build/Bright Lantern.app"
# mise-tasks/bundle does the assembling, so that a release (through
# goreleaser) and this build the same layout; see it for why the bundle looks
# the way it does.
#
# Not a dependency of check, which stays the quick loop; CI runs it after.
depends = ["build", "setup"]
sources = [
  "mise-tasks/bundle",
  "cmd/brightlantern-app/*.swift",
  "cmd/brightlantern-app/*.plist",
  "cmd/brightlantern-app/AppIcon.png",
  "LICENSE",
  "NOTICE.md",
  "brightlantern",
  "{{env.BRIGHTLANTERN_DATA_DIR}}/brightlantern-apple",
  "{{env.BRIGHTLANTERN_DATA_DIR}}/lembed0.dylib",
  "{{env.BRIGHTLANTERN_DATA_DIR}}/all-MiniLM-L6-v2.Q8_0.gguf",
]
outputs = ["build/Bright Lantern.app/Contents/MacOS/brightlantern-app", "build/Bright Lantern.app/Contents/MacOS/brightlantern", "build/Bright Lantern.app/Contents/Info.plist"]
# From nothing every time, so a file dropped from the layout does not linger.
# It also moves the bundle directory's mtime, which is what the Dock and the
# app switcher key their icon cache on: rebuilt in place, a changed icon never
# showed up. The version is the one `mise run build` stamps into the daemon.
run = '''
rm -rf "build/Bright Lantern.app"
mkdir -p "build/Bright Lantern.app/Contents/MacOS"
cp brightlantern "build/Bright Lantern.app/Contents/MacOS/"
mise-tasks/bundle "build/Bright Lantern.app" "$(git describe --tags --dirty 2>/dev/null || echo dev)"
'''

[tasks.app-test]
description = "Test the app's logic that needs no window"
run = '''
command -v swiftc >/dev/null || { echo "app-test: no swiftc; install Command Line Tools: xcode-select --install" >&2; exit 1; }
mkdir -p build
swiftc -target arm64-apple-macos26.0 -o build/app-test cmd/brightlantern-app/address.swift cmd/brightlantern-app/startup.swift cmd/brightlantern-app/agent.swift cmd/brightlantern-app/test/main.swift
build/app-test
'''

[tasks.build]
description = "Build the brightlantern binary"
depends = ["ts", "sqlite-header", "apple"]
# git describe fails in a repository with no tags, and an empty -X value sets
# Version to the empty string rather than leaving the source default.
run = 'go build -ldflags "-X main.Version=$(git describe --tags --dirty 2>/dev/null || echo dev)" -o brightlantern ./cmd/brightlantern'

[tasks.test]
description = "Run the Go test suite"
# The web package embeds internal/web/static, and app.js is generated rather
# than committed. Without this a fresh clone fails the test asserting the
# app's own script is served -- as CI did, before this line.
depends = ["ts", "sqlite-header"]
run = "go test ./..."

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -l -w ."

[tasks.lint]
description = "Vet, lint, and typecheck"
depends = ["sqlite-header"]
run = [
  "go vet ./...",
  "golangci-lint run",
  "pnpm exec oxlint internal/web/ts e2e",
  "pnpm exec tsc --noEmit",
  # The e2e sources are not part of the browser build and have their own
  # config: node and @playwright/test in scope, nothing emitted.
  "pnpm exec tsc -p e2e",
]

[tasks.gofmt-check]
description = "Fail if any Go source is unformatted"
run = 'out=$(gofmt -l .); if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi'

[tasks.check]
description = "Everything CI runs; run this before committing"
depends = ["gofmt-check", "lint", "test"]

[tasks.index]
description = "Build the search index"
depends = ["build"]
run = "./brightlantern index"

[tasks."dev:go"]
description = "Run the server, rebuilding on change"
depends = ["apple"]
# Beside the LaunchAgent rather than instead of it: its own port, and reading
# only. A second writer on the same index is what serve and index go out of
# their way to prevent, and the agent is already keeping it current.
run = "wgo run ./cmd/brightlantern serve --dev --addr 127.0.0.1:5269 --no-watch"

[tasks."dev:ts"]
description = "Compile TypeScript on change"
run = "pnpm exec tsc --watch --preserveWatchOutput"

[tasks.dev]
description = "Run the server and the TypeScript compiler in watch mode"
depends = ["dev:go", "dev:ts"]

[tasks.e2e]
description = "Browser smoke tests (run e2e-install once first)"
# Playwright starts the server itself (see e2e/serve.sh), which is what knows
# how to build a throwaway index over the committed fixtures.
#
# Deliberately not part of `check`: it is an order of magnitude slower than
# everything else and needs a browser that is not a repository dependency.
run = "pnpm exec playwright test"

[tasks.e2e-install]
description = "Download the browser the e2e tests drive"
# Playwright's browsers live in a shared cache outside the repo, and the
# version is tied to the @playwright/test release. Bumping that package means
# running this again; Playwright says so itself when the build is missing.
run = "pnpm exec playwright install chromium"

[tasks.release]
description = "Publish a release for the current tag (run by CI on a v* tag)"
# Through mise rather than bare goreleaser, because .goreleaser.yaml needs the
# [env] block above -- CGO_CFLAGS in particular, which points cgo at the staged
# sqlite3.h. A preflight hook in .goreleaser.yaml fails the build when it is
# missing, rather than quietly compiling against whichever header the machine
# happens to have.
run = "goreleaser release --clean"

[tasks.release-snapshot]
description = "Build the release artifacts locally, without tagging or publishing"
run = "goreleaser release --snapshot --clean"

[tasks.clean]
run = "rm -f brightlantern internal/web/static/app.js internal/web/static/app.js.map && rm -rf test-results playwright-report dist build"
